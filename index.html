<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>cleanier building · 청구서 제작 도구 (2026)</title>
<style>
  :root{ --navy:#13294b; --blue:#1c6fb8; --line:#e4e9f0; --bg:#f4f6fa; --ok:#1a8a54; --bad:#c62b39; --warn:#c07d12; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Noto Sans KR','Noto Sans','Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:#1a2233;background:var(--bg);font-size:13px;}
  a{color:var(--blue);}
  .app{display:flex;min-height:100vh;}
  .side{width:320px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;}
  .brand{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:2px solid var(--navy);}
  .brand .w{font-size:18px;font-weight:800;letter-spacing:-.3px;}
  .brand .w .a{color:var(--navy);} .brand .w .b{color:var(--blue);}
  .filters{padding:12px 16px;border-bottom:1px solid var(--line);}
  .filters label{display:block;font-size:11px;color:#667;margin:8px 0 3px;font-weight:700;}
  .filters select,.filters input{width:100%;padding:7px 8px;border:1px solid #cdd6e2;border-radius:6px;font-size:13px;background:#fff;}
  .stat{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .stat .pill{background:#eef3f9;color:var(--navy);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;}
  .invlist{overflow:auto;flex:1;}
  .grp{padding:7px 16px 3px;font-size:11px;font-weight:800;color:var(--blue);background:#f8fafc;position:sticky;top:0;border-bottom:1px solid var(--line);}
  .item{padding:9px 16px;border-bottom:1px solid #eef1f5;cursor:pointer;}
  .item:hover{background:#f2f7fd;}
  .item.sel{background:#e7f0fb;border-left:3px solid var(--blue);padding-left:13px;}
  .item .c{font-weight:700;color:#1a2233;}
  .item .m{font-size:11px;color:#7a8699;margin-top:2px;display:flex;justify-content:space-between;gap:6px;}
  .badge{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:700;}
  .b-done{background:#e3f5ec;color:var(--ok);} .b-plan{background:#fdf0dc;color:var(--warn);} .b-chk{background:#fde6e8;color:var(--bad);}
  .main{flex:1;padding:20px 26px;overflow:auto;height:100vh;}
  .tabs{display:flex;gap:8px;margin-bottom:16px;}
  .tabs button{padding:8px 16px;border:1px solid #cdd6e2;background:#fff;border-radius:8px;font-size:13px;font-weight:700;color:#556;cursor:pointer;}
  .tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy);}
  h2{font-size:16px;margin:0 0 4px;color:var(--navy);}
  .sub{color:#7a8699;font-size:12px;margin-bottom:14px;}
  table.grid{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(20,40,80,.06);}
  table.grid th{background:#eef2f7;color:var(--navy);font-weight:700;padding:9px 8px;font-size:11.5px;text-align:center;border-bottom:1px solid #d7dfea;white-space:nowrap;}
  table.grid td{padding:8px;border-bottom:1px solid #eef1f5;font-size:12px;}
  table.grid td.num{text-align:right;font-variant-numeric:tabular-nums;}
  table.grid td.c{text-align:center;}
  .chk-ok{color:var(--ok);font-weight:800;} .chk-bad{color:var(--bad);font-weight:800;}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,40,80,.05);}
  .card h3{margin:0 0 10px;font-size:14px;color:var(--navy);border-left:4px solid var(--blue);padding-left:8px;}
  .kv{display:flex;flex-wrap:wrap;gap:6px 26px;margin-bottom:6px;}
  .kv div{font-size:12px;} .kv b{color:#667;font-weight:700;margin-right:6px;}
  .totrow{display:flex;justify-content:flex-end;gap:26px;margin-top:10px;font-size:13px;align-items:center;}
  .totrow .big{font-size:22px;font-weight:800;color:var(--navy);}
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--navy);color:#fff;border:none;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;}
  .btn:hover{background:#0e1f3a;} .btn.blue{background:var(--blue);}
  .btn.ghost{background:#fff;color:var(--navy);border:1px solid #cdd6e2;}
  .actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;}
  .flag{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:700;margin-left:6px;}
  .flag.ok{background:#e3f5ec;color:var(--ok);} .flag.bad{background:#fde6e8;color:var(--bad);} .flag.warn{background:#fdf0dc;color:var(--warn);}
  .empty{color:#8a94a6;padding:40px;text-align:center;}
  .note-s{font-size:11px;color:#8a94a6;margin-top:6px;}
  .hint{background:#fff8e8;border:1px solid #f0e0b8;border-radius:8px;padding:10px 14px;font-size:12px;color:#7a6320;margin-bottom:14px;}
  .fontwarn{display:none;align-items:center;gap:12px;flex-wrap:wrap;background:#fff4e0;border-bottom:2px solid #e6b34d;color:#7a5b12;padding:11px 18px;font-size:13px;line-height:1.5;}
  .fontwarn b{color:#7a5b12;}
  .fw-btn{background:#c07d12;color:#fff!important;text-decoration:none;padding:6px 14px;border-radius:7px;font-weight:700;font-size:12.5px;white-space:nowrap;}
  .fw-btn:hover{background:#a86a0c;}
  .fw-x{margin-left:auto;border:none;background:transparent;color:#7a5b12;font-size:15px;cursor:pointer;font-weight:800;}
  table.grid td input, table.grid td select{width:100%;border:1px solid transparent;background:transparent;padding:5px 6px;font-size:12px;border-radius:5px;font-family:inherit;color:#1a2233;}
  table.grid td input:hover, table.grid td select:hover{border-color:#dbe3ee;background:#fff;}
  table.grid td input:focus, table.grid td select:focus{border-color:var(--blue);background:#fff;outline:none;box-shadow:0 0 0 2px rgba(28,111,184,.12);}
  table.grid td input.num{text-align:right;font-variant-numeric:tabular-nums;}
  table.grid td.del{text-align:center;}
  .xbtn{border:none;background:#f4d7da;color:#c62b39;width:22px;height:22px;border-radius:5px;cursor:pointer;font-weight:800;line-height:1;}
  .xbtn:hover{background:#e9b7bc;}
  .addbtn{margin-top:8px;background:#eef4fb;color:var(--navy);border:1px dashed #9cc0e6;border-radius:7px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;}
  .addbtn:hover{background:#e2eefb;}
  .rcpt{color:var(--blue);text-decoration:none;font-size:11px;font-weight:700;white-space:nowrap;}
  .editmark{background:#fdf0dc;color:var(--warn);font-size:11px;padding:2px 9px;border-radius:10px;font-weight:700;margin-left:8px;}
  .rcin{font-size:11px !important;}
  .hdredit{display:flex;gap:12px;flex-wrap:wrap;}
  .hdredit label{flex:1;min-width:160px;font-size:11px;color:#667;font-weight:700;}
  .hdredit input{width:100%;margin-top:3px;padding:6px 8px;border:1px solid #cdd6e2;border-radius:6px;font-size:12px;font-family:inherit;}
  .notesarea{width:100%;min-height:96px;border:1px solid #cdd6e2;border-radius:8px;padding:10px 12px;font-family:inherit;font-size:12.5px;line-height:1.65;resize:vertical;color:#1a2233;}
  .notesarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 2px rgba(28,111,184,.12);}
  .lastupd{margin:0 0 12px;padding:8px 10px;background:#eef3f9;border:1px solid #dce4ef;border-radius:8px;font-size:11px;line-height:1.5;color:#48566a;}
  .lastupd b{display:block;font-size:11.5px;color:#13294b;font-weight:700;margin-top:1px;}
  .lastupd .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:#2e9e5b;margin-right:5px;vertical-align:middle;}
</style>
</head>

const BILL = ['청구완료','청구예정'];
const EDKEY = k => 'inv_ed:'+(DATA.generated||'')+':'+k;

let INVOICES=[], ORPHAN=[], TAB='detail', SEL=null;
function el(id){return document.getElementById(id);}

function buildInvoices(){
  const bizToCust={}; DATA.cheonggu.forEach(r=>{ if(r.bizNo) bizToCust[r.bizNo]=r.cust; });
  const map={};
  DATA.cheonggu.forEach(r=>{
    const key=r.mgr+'|'+r.cust+'|'+r.month;
    if(!map[key]) map[key]={key,mgr:r.mgr,cust:r.cust,month:r.month,bizNo:r.bizNo||'',bizName:r.bizName||r.cust,rows:[],silbi:[],buildings:new Set(),statusCount:{}};
    const inv=map[key]; inv.rows.push(r); if(r.bldg) inv.buildings.add(r.bldg);
    inv.statusCount[r.status]=(inv.statusCount[r.status]||0)+1;
    if(!inv.bizNo && r.bizNo) inv.bizNo=r.bizNo;
  });
  const invs=Object.values(map);
  const byBizMonth={}; invs.forEach(v=>{ if(v.bizNo) byBizMonth[v.bizNo+'|'+v.month]=v; });
  // fallback map: exact 거래명(건물)+월 -> invoice keys (여러 고객사가 같은 거래명이면 애매 → 자동매칭 안 함)
  const byBldgMonth={}; invs.forEach(v=>{ v.buildings.forEach(b=>{ const k=b+'|'+v.month; (byBldgMonth[k]=byBldgMonth[k]||new Set()).add(v.key); }); });
  DATA.silbi.forEach(s=>{
    let v=byBizMonth[s.bizNo+'|'+s.month];                 // 1순위: 사업자번호+월
    if(!v){ const set=byBldgMonth[s.bldg+'|'+s.month];     // 2순위: 거래명+월 (유일할 때만)
      if(set && set.size===1) v=invs.find(x=>x.key===[...set][0]); }
    if(v) v.silbi.push(s); else ORPHAN.push(s);
  });
  invs.forEach(v=>{ v.calc=calc(v); });
  invs.sort((a,b)=> a.mgr.localeCompare(b.mgr,'ko')||a.cust.localeCompare(b.cust,'ko')||a.month-b.month);
  INVOICES=invs;
}
function calc(v){
  const lines=v.rows.filter(r=>r.q>0).map(r=>({bldg:r.bldg,gubun:r.gubun,type:r.type,supply:r.q,vat:Math.round(r.q*0.1),sub:r.q+Math.round(r.q*0.1)}));
  const sumQ=v.rows.reduce((a,r)=>a+r.q,0), sumT=v.rows.reduce((a,r)=>a+r.t,0);
  const sumU=v.rows.reduce((a,r)=>a+r.u,0), sumV=v.rows.reduce((a,r)=>a+r.v,0);
  const dispVat=lines.reduce((a,l)=>a+l.vat,0), dispTot=sumQ+dispVat;
  const silbiBill=v.silbi.filter(s=>BILL.includes(s.status)), silbiExcl=v.silbi.filter(s=>!BILL.includes(s.status));
  const silbiSum=silbiBill.reduce((a,s)=>a+s.supply,0);
  const silbiServiceQ=v.rows.filter(r=>r.type==='실비').reduce((a,r)=>a+r.q,0);
  const chkBilled=sumT===0?null:(sumQ===sumT), chkSilbi=silbiServiceQ===silbiSum;
  return {lines,sumQ,sumT,sumU,sumV,dispVat,dispTot,silbiBill,silbiExcl,silbiSum,silbiServiceQ,chkBilled,chkSilbi};
}
function overallStatus(v){ const s=v.statusCount;
  if((s['발급완료']||0)>0 && !(s['발급예정']||0) && !(s['확인필요']||0)) return {t:'발급완료',cls:'b-done'};
  if((s['확인필요']||0)>0) return {t:'확인필요',cls:'b-chk'};
  return {t:'발급예정',cls:'b-plan'};
}

// ---------- editable model ----------
function initEd(v){
  if(v.ed) return v.ed;
  const stored=localStorage.getItem(EDKEY(v.key));
  if(stored){ try{ v.ed=JSON.parse(stored); v.edited=true; return v.ed; }catch(e){} }
  const c=v.calc, mst=DATA.master[v.bizNo]||{};
  v.ed={
    custName: mst.bizName||v.bizName||v.cust, ceo: mst.ceo||'', addr: mst.addr||'', bizNo: v.bizNo||'',
    lines: c.lines.map(l=>({bldg:l.bldg,gubun:l.gubun,desc:'클리니어 ['+l.type+'] 서비스',supply:l.supply,vat:l.vat})),
    silbi: c.silbiBill.map(s=>({date:s.date,item:s.item,taxfree:s.taxfree||'',supply:s.supply,vat:s.vat,settle:s.settle,receipt:s.receipt||''})),
    notes: '· 세금계산서 발행일로부터 10영업일 이내 청구 금액을 입금하여 주시기 바랍니다.\n· 세금계산서 발급(예정)일 : '+monthEnd(v.month)+'\n· 문의 : 주식회사 한국공간데이터 자산관리팀'
  };
  syncSilLine(v.ed);   // 실비 서비스 라인을 구매내역(실비 detail) 합계로 맞춤 (면세 반영)
  return v.ed;
}
// 실비 서비스 라인 = 실비 구매내역 합계 (면세는 부가세 0). 구매내역이 있으면 항상 이 값으로 맞춘다.
function syncSilLine(ed){
  if(!ed.silbi || ed.silbi.length===0) return;
  const sup=ed.silbi.reduce((a,s)=>a+num(s.supply),0), vt=ed.silbi.reduce((a,s)=>a+num(s.vat),0);
  let ln=ed.lines.find(l=>/실비/.test(l.desc));
  if(ln){ ln.supply=sup; ln.vat=vt; } else { ed.lines.push({bldg:'',gubun:'정기',desc:'클리니어 [실비] 서비스',supply:sup,vat:vt}); }
}
function saveEd(v){ v.edited=true; try{ localStorage.setItem(EDKEY(v.key), JSON.stringify(v.ed)); }catch(e){} }
function resetEd(key){ const v=INVOICES.find(x=>x.key===key); v.ed=null; v.edited=false; try{localStorage.removeItem(EDKEY(key));}catch(e){} render(); }
function edTotals(ed){
  const ss=ed.lines.reduce((a,l)=>a+num(l.supply),0), sv=ed.lines.reduce((a,l)=>a+num(l.vat),0);
  const silS=ed.silbi.reduce((a,s)=>a+num(s.supply),0), silV=ed.silbi.reduce((a,s)=>a+num(s.vat),0), silT=ed.silbi.reduce((a,s)=>a+num(s.settle),0);
  return {ss,sv,st:ss+sv,silS,silV,silT};
}
function chHdr(key,f,val){ const v=INVOICES.find(x=>x.key===key); v.ed[f]=val; saveEd(v); markEdited(v); }
function chLine(key,i,f,val){ const v=INVOICES.find(x=>x.key===key); const l=v.ed.lines[i];
  if(f==='supply'){ l.supply=num(val); l.vat=Math.round(l.supply*0.1); const e=el('lv_'+i); if(e)e.value=won(l.vat); }
  else if(f==='vat'){ l.vat=num(val); } else l[f]=val;
  saveEd(v); refresh(key); }
function chSil(key,i,f,val){ const v=INVOICES.find(x=>x.key===key); const s=v.ed.silbi[i];
  const exempt=()=>/면세/.test(s.taxfree||'');
  if(f==='supply'){ s.supply=num(val); s.vat=exempt()?0:Math.round(num(s.supply)*0.1); s.settle=num(s.supply)+num(s.vat); let e=el('sv_'+i); if(e)e.value=won(s.vat); e=el('ss_'+i); if(e)e.value=won(s.settle); }
  else if(f==='vat'){ s.vat=num(val); s.settle=num(s.supply)+s.vat; const e=el('ss_'+i); if(e)e.value=won(s.settle); }
  else if(f==='settle'){ s.settle=num(val); }
  else if(f==='taxfree'){ s.taxfree=val; s.vat=exempt()?0:Math.round(num(s.supply)*0.1); s.settle=num(s.supply)+num(s.vat); let e=el('sv_'+i); if(e)e.value=won(s.vat); e=el('ss_'+i); if(e)e.value=won(s.settle); }
  else s[f]=val;
  syncSilLine(v.ed);
  const j=v.ed.lines.findIndex(l=>/실비/.test(l.desc));
  if(j>=0){ let e=el('ls_'+j); if(e)e.value=won(v.ed.lines[j].supply); e=el('lv_'+j); if(e)e.value=won(v.ed.lines[j].vat); e=el('lsub_'+j); if(e)e.textContent=won(num(v.ed.lines[j].supply)+num(v.ed.lines[j].vat)); }
  saveEd(v); refresh(key); }
function addLine(key){ const v=INVOICES.find(x=>x.key===key); v.ed.lines.push({bldg:[...v.buildings][0]||'',gubun:'정기',desc:'클리니어 [ ] 서비스',supply:0,vat:0}); saveEd(v); renderDetail(); }
function delLine(key,i){ const v=INVOICES.find(x=>x.key===key); v.ed.lines.splice(i,1); saveEd(v); renderDetail(); }
function addSil(key){ const v=INVOICES.find(x=>x.key===key); v.ed.silbi.push({date:'',item:'',taxfree:'과세',supply:0,vat:0,settle:0,receipt:''}); syncSilLine(v.ed); saveEd(v); renderDetail(); }
function delSil(key,i){ const v=INVOICES.find(x=>x.key===key); v.ed.silbi.splice(i,1); syncSilLine(v.ed); saveEd(v); renderDetail(); }
function markEdited(v){ const em=el('editmark'); if(em) em.style.display=v.edited?'inline-block':'none'; }
function refresh(key){
  const v=INVOICES.find(x=>x.key===key); const t=edTotals(v.ed);
  v.ed.lines.forEach((l,i)=>{ const c=el('lsub_'+i); if(c)c.textContent=won(num(l.supply)+num(l.vat)); });
  const set=(id,val)=>{const e=el(id); if(e)e.textContent=won(val);};
  set('t_ss',t.ss); set('t_sv',t.sv); set('t_st',t.st); set('grand',t.st);
  set('sil_s',t.silS); set('sil_v',t.silV); set('sil_t',t.silT);
  const rec=el('silchk');
  if(rec){ const origQ=v.calc.silbiServiceQ;
    rec.innerHTML = (v.ed.silbi.length===0||origQ===t.silS)?'<span class="flag ok">✓ 실비 = 구매내역합 ('+won(t.silS)+')</span>':'<span class="flag warn">⚠ 청구대상 실비Q '+won(origQ)+' ≠ 구매내역합 '+won(t.silS)+' (청구서는 구매내역 기준으로 반영됨)</span>'; }
  markEdited(v);
}

// ---------- filtering ----------
function filtered(){ const m=el('fMgr').value,mo=el('fMonth').value,c=el('fCust').value,st=el('fStatus').value;
  return INVOICES.filter(v=>{ if(m&&v.mgr!==m)return false; if(mo&&String(v.month)!==mo)return false; if(c&&v.cust!==c)return false; if(st&&overallStatus(v).t!==st)return false; return true; }); }
function populateFilters(){ const mgrs=[...new Set(INVOICES.map(v=>v.mgr))].sort((a,b)=>a.localeCompare(b,'ko'));
  el('fMgr').innerHTML='<option value="">전체 담당자</option>'+mgrs.map(m=>`<option>${m}</option>`).join('');
  const months=[...new Set(INVOICES.map(v=>v.month))].sort((a,b)=>a-b);
  el('fMonth').innerHTML='<option value="">전체 ('+months.join('·')+'월)</option>'+months.map(m=>`<option value="${m}">${m}월</option>`).join('');
  refreshCustFilter(); }
function refreshCustFilter(){ const m=el('fMgr').value,mo=el('fMonth').value;
  let pool=INVOICES.filter(v=>(!m||v.mgr===m)&&(!mo||String(v.month)===mo));
  const custs=[...new Set(pool.map(v=>v.cust))].sort((a,b)=>a.localeCompare(b,'ko')); const cur=el('fCust').value;
  el('fCust').innerHTML='<option value="">전체 고객사</option>'+custs.map(c=>`<option ${c===cur?'selected':''}>${c}</option>`).join(''); }

// ---------- sidebar ----------
function renderList(){ const list=filtered();
  el('stat').innerHTML=`<span class="pill">청구서 ${list.length}건</span><span class="pill">공급가 ${won(list.reduce((a,v)=>a+v.calc.sumQ,0))}</span>`;
  const box=el('invlist'); box.innerHTML=''; let curMgr=null;
  list.forEach(v=>{ if(v.mgr!==curMgr){ curMgr=v.mgr; const g=document.createElement('div'); g.className='grp'; g.textContent='담당자 · '+curMgr; box.appendChild(g); }
    const os=overallStatus(v); const d=document.createElement('div'); d.className='item'+(SEL===v.key?' sel':'');
    d.innerHTML=`<div class="c">${escHtml(v.cust)}${v.edited?' <span style="color:#c07d12">✎</span>':''}</div><div class="m"><span>${v.month}월 · ${won(v.calc.sumQ)}원</span><span class="badge ${os.cls}">${os.t}</span></div>`;
    d.onclick=()=>{ SEL=v.key; TAB='detail'; setTabButtons(); render(); }; box.appendChild(d); });
  if(!list.length) box.innerHTML='<div class="empty">조건에 맞는 청구서가 없습니다.</div>';
}

function render(){ TAB==='summary'?renderSummary():renderDetail(); renderList(); }

    <td style="width:92px"><input class="num" id="ss_${i}" value="${won(s.settle)}" oninput="chSil('${v.key}',${i},'settle',this.value)"></td>
    <td style="width:150px"><input class="rcin" placeholder="증빙자료 URL" value="${escAttr(s.receipt)}" oninput="chSil('${v.key}',${i},'receipt',this.value)">${s.receipt?` <a class="rcpt" href="${escAttr(s.receipt)}" target="_blank">열기</a>`:''}</td>

// ---------- summary ----------

  let rows=list.map(v=>{ const c=v.calc, os=overallStatus(v);
    const cb=c.chkBilled===null?'<span class="flag warn">미청구</span>':(c.chkBilled?'<span class="chk-ok">✓</span>':'<span class="chk-bad">✗</span>');
    const cs=v.silbi.length===0?'-':(c.chkSilbi?'<span class="chk-ok">✓</span>':'<span class="chk-bad">✗</span>');
    return `<tr><td>${escHtml(v.mgr)}</td><td>${escHtml(v.cust)}${v.edited?' ✎':''}</td><td class="c">${v.month}</td>
      <td class="c"><span class="badge ${os.cls}">${os.t}</span></td>

      <td class="num">${c.silbiSum?won(c.silbiSum):'-'}</td><td class="c">${cb}</td><td class="c">${cs}</td></tr>`; }).join('');

    ${badCount?`<div class="hint">⚠ 불일치 ${badCount}건이 있습니다. 아래 ✗ 표시를 확인하세요. (발급예정=아직 확정청구 전이라 '미청구'로 표시)</div>`:'<div class="hint" style="background:#eefaf2;border-color:#bfe6cf;color:#1a6b41">✓ 검증 대상 전 항목 정상입니다.</div>'}

}

// ---------- customer email (copy-paste) ----------
const BANK = { bank:'기업은행', holder:'주식회사 한국공간데이터', acct:'002-114400-04-012' };
function buildEmail(v){
  const ed=initEd(v), t=edTotals(ed), mst=DATA.master[v.bizNo]||{};
  const name = (ed.custName||v.cust||'').trim();
  const contact = (mst.ceo||'').trim();
  const greet = v.cust + ' ' + (contact ? contact+' 님' : '[받는 분 성함/직함]님');
  const email = (mst.email||'').trim() || '[세금계산서 수신 이메일]';
  const svc = ed.lines.filter(l=>num(l.supply)>0).map(l=>{
    const m=(l.desc||'').match(/\[(.+?)\]/); const type = m?m[1]:(l.desc||'').replace(/클리니어|서비스/g,'').trim();
    return ((l.gubun||'')+' '+type+' 서비스').trim();
  }).join(', ') || '서비스';
  const cost = won(t.st)+'원(부가세 포함)';
  const baseDate = v.month+'/1';
  return [
    '안녕하세요, '+greet+'.',
    '클리니어빌딩 '+v.mgr+' 입니다.',
    '',
    '하기 내용으로 세금계산서 발급 예정이오니, 확인 후 처리 부탁드리겠습니다.',
    '',
    '사업자정보 : '+(ed.bizNo||'-')+' / '+name,
    '서비스내역 : '+svc+'_26년 '+v.month+'월',
    '서비스비용 : '+cost,
    '세금계산서 발급할 곳 : '+email,
    '발급기준일 : '+baseDate,
    '',
    '입금은행 : '+BANK.bank,
    '입금계좌 : '+BANK.holder,
    '계좌번호 : '+BANK.acct,
    '',
    '이외 문의하실 사항 해당 메일 주소로 답변주시면 내용 확인 후 회신 드리겠습니다.',
    '',
    '감사합니다.',
    v.mgr+' 드림'
  ].join('\n');
}
function regenEmail(key){ const v=INVOICES.find(x=>x.key===key); const b=el('emailbox'); if(b) b.value=buildEmail(v); }
function copyEmail(){
  const t=el('emailbox'); if(!t) return; t.focus(); t.select();
  const done=()=>{ const b=el('emailcopy'); if(b){ const o=b.textContent; b.textContent='✓ 복사됨!'; setTimeout(()=>b.textContent=o,1600);} };
  try{ navigator.clipboard.writeText(t.value).then(done, ()=>{ document.execCommand('copy'); done(); }); }
  catch(e){ try{ document.execCommand('copy'); done(); }catch(_){} }
}

  const silbi=ed.silbi.map(s=>`<tr><td class="c">${escHtml(s.date)}</td><td>${escHtml(s.item)}</td><td class="c">${escHtml(s.taxfree)}</td><td class="n">${won(s.supply)}</td><td class="n">${won(s.vat)}</td><td class="n">${won(s.settle)}</td><td class="c" style="white-space:nowrap">${s.receipt?`<a href="${escAttr(s.receipt)}" style="color:#1c6fb8">증빙자료</a>`:'-'}</td></tr>`).join('');

    <table class="silbi"><thead><tr><th style="width:74px">구매일</th><th>구매품목</th><th style="width:58px">면세/과세</th><th style="width:82px">공급가액</th><th style="width:62px">부가세</th><th style="width:82px">정산금액</th><th style="width:74px">증빙자료</th></tr></thead>
    <tbody>${silbi}<tr class="st"><td class="c" colspan="3">실비 합계</td><td class="n">${won(t.silS)}</td><td class="n">${won(t.silV)}</td><td class="n">${won(t.silT)}</td><td class="c" style="font-weight:800">총 ${ed.silbi.length}건</td></tr></tbody></table>`:'';

  <style>@page{size:A4;margin:11mm 14mm;} *{box-sizing:border-box;} html,body{margin:0;padding:0;}

  .wrap{max-width:720px;margin:0 auto;} .brandrow{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #13294b;padding-bottom:12px;}
  .logo{display:flex;align-items:center;gap:11px;} .word{font-size:26px;font-weight:800;letter-spacing:-.5px;} .word .c1{color:#16243f;} .word .c2{color:#1c6fb8;} .meta{text-align:right;font-size:11px;color:#444;}
  h1{text-align:center;font-size:20px;font-weight:800;letter-spacing:8px;margin:20px 0 4px;color:#13294b;} .stitle{text-align:center;font-size:11px;color:#666;margin:0 0 16px;}
  .parties{display:flex;gap:14px;margin-bottom:14px;} .party{flex:1;border:1px solid #d5dde8;border-radius:6px;overflow:hidden;} .party .h{background:#13294b;color:#fff;font-weight:700;font-size:11px;padding:6px 10px;}
  .party table{width:100%;border-collapse:collapse;} .party td{padding:5px 10px;border-top:1px solid #eef1f5;} .party td.k{width:74px;color:#667;font-size:10.5px;white-space:nowrap;} .party td.v{font-weight:600;}
  .lead{margin:6px 0 8px;} .bldg{display:inline-block;background:#eef4fb;border:1px solid #cfe0f2;color:#1c6fb8;font-weight:700;padding:3px 10px;border-radius:4px;}
  table.items{width:100%;border-collapse:collapse;margin-top:8px;font-size:11.5px;} table.items th{background:#eef2f7;color:#13294b;font-weight:700;padding:8px 6px;border-top:2px solid #13294b;border-bottom:1px solid #cbd6e4;text-align:center;white-space:nowrap;}
  table.items td{padding:7px 8px;border-bottom:1px solid #e7ecf2;} .items td.n{text-align:right;font-variant-numeric:tabular-nums;} .items td.c{text-align:center;} table.items tr.total td{border-top:2px solid #13294b;border-bottom:2px solid #13294b;background:#f5f8fc;font-weight:800;font-size:12.5px;}
  .grand{text-align:right;margin-top:12px;font-size:13px;} .grand .amt{font-size:22px;font-weight:800;color:#13294b;margin-left:10px;}
  .subh{margin:22px 0 6px;font-size:12px;font-weight:700;color:#13294b;border-left:4px solid #1c6fb8;padding-left:8px;}
  table.silbi{width:100%;border-collapse:collapse;font-size:11px;} table.silbi th{background:#f5f7fa;color:#3a4a63;font-weight:700;padding:6px 8px;border:1px solid #e2e8f0;text-align:center;white-space:nowrap;} table.silbi td{padding:6px 8px;border:1px solid #e7ecf2;} .silbi td.n{text-align:right;} .silbi td.c{text-align:center;} .silbi tr.st td{background:#fafbfd;font-weight:700;}
  .note{margin-top:14px;padding:10px 14px;background:#fafbfd;border:1px solid #e3e8ef;border-radius:6px;font-size:10.5px;color:#555;} .note b{color:#13294b;} .foot{margin-top:10px;text-align:center;font-size:10px;color:#9aa7b6;border-top:1px solid #e7ecf2;padding-top:8px;}</style></head>
  <body><div class="wrap">
    <div class="brandrow"><div class="logo">${LOGO}</div>
      <div class="meta">서비스 귀속 : 2026년 ${v.month}월<br>담당자 : ${escHtml(v.mgr)}</div></div>
    <h1>청 구 서</h1><p class="stitle">클리니어 빌딩 서비스 내역서 (Statement of Building Service)</p>
    <div class="parties">
      <div class="party"><div class="h">공급자</div><table><tr><td class="k">등록번호</td><td class="v">${SUP.regNo}</td></tr><tr><td class="k">상호</td><td class="v">${SUP.name}</td></tr><tr><td class="k">대표자</td><td class="v">${SUP.ceo}</td></tr><tr><td class="k">사업장주소</td><td class="v">${SUP.addr}</td></tr></table></div>
      <div class="party"><div class="h">공급받는자</div><table><tr><td class="k">등록번호</td><td class="v">${escHtml(ed.bizNo)||'-'}</td></tr><tr><td class="k">상호</td><td class="v">${escHtml(ed.custName)}</td></tr><tr><td class="k">대표자</td><td class="v">${escHtml(ed.ceo)||'-'}</td></tr><tr><td class="k">사업장주소</td><td class="v">${escHtml(ed.addr)||'-'}</td></tr></table></div>
    </div>
    <p class="lead">대상 건물 : <span class="bldg">${escHtml(bldgs)}</span> &nbsp;·&nbsp; 아래와 같이 청구서를 발송합니다.</p>
    <table class="items"><thead><tr><th style="width:40px">No.</th>${multi?'<th>건물</th>':''}<th style="width:58px">구분</th><th>서비스 내역</th><th style="width:94px">공급가액</th><th style="width:80px">부가세</th><th style="width:96px">소계</th></tr></thead>
    <tbody>${items||`<tr><td colspan="${multi?7:6}" class="c">항목 없음</td></tr>`}<tr class="total"><td class="c" colspan="${multi?4:3}">금액 합계</td><td class="n">${won(t.ss)}</td><td class="n">${won(t.sv)}</td><td class="n">${won(t.st)}</td></tr></tbody></table>
    <div class="grand">청구 합계 금액 <span class="amt">₩ ${won(t.st)}</span></div>
    ${silbiBlock}
    <div class="note"><b>안내사항</b><br>${escHtml(ed.notes).replace(/\n/g,'<br>')}</div>
    <div class="foot">본 내역서는 주식회사 한국공간데이터가 발행한 청구 문서입니다. · cleanier building</div>
  </div></body></html>`;
}
function openPrint(html, autoPrint){ const w=window.open('','_blank'); w.document.open(); w.document.write(html); w.document.close();
  if(autoPrint){ w.onload=()=>{ setTimeout(()=>w.print(),300); }; setTimeout(()=>{ try{w.print();}catch(e){} },700); } }
function previewInvoice(key){ openPrint(invoiceHTML(INVOICES.find(x=>x.key===key)),false); }
function downloadInvoice(key){ openPrint(invoiceHTML(INVOICES.find(x=>x.key===key)),true); }
function downloadFiltered(){ const list=filtered(); if(!list.length){alert('청구서가 없습니다.');return;}
  const inner=list.map(v=>{ const h=invoiceHTML(v); const m=h.indexOf('<body>'), e=h.indexOf('</body>'); return '<div style="page-break-after:always">'+h.substring(m+6,e)+'</div>'; }).join('');
  const first=invoiceHTML(list[0]); const head=first.substring(0,first.indexOf('<body>'));
  openPrint((head+'<body>'+inner+'</body></html>').replace(/<title>[^<]*<\/title>/,'<title>청구서_일괄_'+list.length+'건</title>'),true); }

// ---------- font check ----------
function fontAvailable(font){
  try{
    const test='ABCabc가나다라마바사아자차카타파하0123456789';
    const bases=['monospace','serif','sans-serif']; const size='72px';
    const c=document.createElement('canvas').getContext('2d');
    for(const b of bases){ c.font=size+' '+b; const w0=c.measureText(test).width; c.font=size+' "'+font+'",'+b; if(c.measureText(test).width!==w0) return true; }
    return false;
  }catch(e){ return true; }
}

function setTab(t){ TAB=t; setTabButtons(); render(); }
function setTabButtons(){ el('tabDetail').className=TAB==='detail'?'on':''; el('tabSummary').className=TAB==='summary'?'on':''; }
function fillLastUpd(){ const g=(DATA.generated||'').trim();
  el('lastupd').innerHTML = g
    ? '<span class="dot"></span>데이터 최종 업데이트<b>'+escHtml(g)+'</b>'
    : '<span class="dot"></span>데이터 최종 업데이트<b>-</b>'; }
function init(){ buildInvoices(); populateFilters(); fillLastUpd();
  el('fMgr').onchange=()=>{refreshCustFilter();render();}; el('fMonth').onchange=()=>{refreshCustFilter();render();};
  el('fCust').onchange=render; el('fStatus').onchange=render;
  if(INVOICES.length) SEL=INVOICES[0].key; render();
  if(!fontAvailable('Noto Sans KR')){ el('fontwarn').style.display='flex'; } }
init();
